# Whenever data/sites.csv or data/surf-spots.csv changes (including edits made
# on github.com), GitHub checks them for mistakes, rebuilds sites.js and
# surfSpots.js, saves them, and republishes
# the live site. If the check finds a mistake, this run fails and GitHub emails
# you; nothing is changed.

name: Build site guide

on:
  push:
    branches: [main]
    paths: ["data/sites.csv", "data/surf-spots.csv"]

permissions:
  contents: write  # to save the rebuilt files
  pages: write  # to republish the live site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the CSVs and build sites.js and surfSpots.js
        run: python3 tools/build_sites.py

      - name: Save the files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sites.js surfSpots.js
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Rebuild the site guides from data/*.csv"
            git push
          fi

      - name: Republish the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
